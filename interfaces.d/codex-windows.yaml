name: codex_windows
description: Control existing Codex Work windows on the VPS
actions:
  list:
    description: List recent Codex Work windows
    transport: command
    command:
      - /usr/bin/node
      - /opt/vps-action-gateway/codex-window-control.js
      - list
    input_schema:
      type: object
  current:
    description: Show the currently selected Codex Work window
    transport: command
    command:
      - /usr/bin/node
      - /opt/vps-action-gateway/codex-window-control.js
      - current
    input_schema:
      type: object
  switch:
    description: Switch the active Codex Work window by exact name, partial name, or thread id
    transport: command
    command:
      - /usr/bin/node
      - /opt/vps-action-gateway/codex-window-control.js
      - switch
      - ${input.window}
    input_schema:
      type: object
      required: [window]
      properties:
        window:
          type: string
  send:
    description: Send a message to the currently selected Codex Work window
    transport: command
    timeout_ms: 120000
    command:
      - /usr/bin/node
      - /opt/vps-action-gateway/codex-window-control.js
      - send
      - ${input.message}
    input_schema:
      type: object
      required: [message]
      properties:
        message:
          type: string
