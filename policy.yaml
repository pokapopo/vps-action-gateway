commands:
  default: confirm
  deny:
    - '^.*(?:/usr/bin/)?systemctl\s+stop\s+nginx(?:\.service)?(?:\s|;|$)'
    - '^.*service\s+nginx\s+stop(?:\s|;|$)'
  allow:
    - '^git\s+(?:status|diff|rev-parse|log)(?:\s|$)'
    - '^nginx\s+-t(?:\s|$)'
    - '^systemctl\s+(?:status|is-active|show)(?:\s|$)'
    - '^(?:pwd|whoami|uptime)$'
    - '^id(?:\s+[-A-Za-z0-9]+)*$'
    - '^uname(?:\s+[-A-Za-z0-9]+)*$'
    - '^free(?:\s+[-A-Za-z0-9]+)*$'
    - '^node\s+--check\s+/opt/vps-action-gateway(?:/[A-Za-z0-9._-]+)+$'
    - '^sqlite3\s+-readonly\s+\S+\s+[''"]?(?:SELECT|PRAGMA|EXPLAIN\s+QUERY\s+PLAN\s+SELECT)\b[^;]*;?[''"]?$'
    - '^grep(?:\s+--?[A-Za-z0-9][A-Za-z0-9=-]*)*\s+\S+\s+\S+(?:\s+\S+)*$'
    - '^(?:head|tail)(?:\s+--?[A-Za-z0-9][A-Za-z0-9=-]*)*(?:\s+\S+)?$'
    - '^(?:sort|uniq|wc)(?:\s+--?[A-Za-z0-9][A-Za-z0-9=-]*)*$'
    - '^ss(?:\s+[-A-Za-z0-9=:.,/]+)*$'
    - '^ps(?:\s+[-A-Za-z0-9=:.,/]+)*$'
    - '^pgrep(?:\s+[-A-Za-z0-9=:.,/]+)*$'
    - '^pstree(?:\s+-[A-Za-z0-9]+)*$'
    - '^df(?:\s+-[A-Za-z0-9]+)*$'
    - '^du(?:\s+-[A-Za-z0-9=:,.]+)*(?:\s+\S+)*$'
    - '^stat(?:\s+-[A-Za-z0-9]+)*\s+\S+(?:\s+\S+)*$'
    - '^lsblk(?:\s+-[A-Za-z0-9]+)*$'
    - '^systemctl\s+(?:status|is-active|is-enabled|show|list-units|list-unit-files|cat)(?:\s+[A-Za-z0-9@_.-]+)*(?:\s+--[a-z-]+)*$'
    - '^which(?:\s+\S+)+$'
    - '^grep(?:\s+--?[A-Za-z0-9][A-Za-z0-9=-]*)*\s+\S+$'
    - '^sha256sum\s+\S+(?:\s+\S+)*$'
    - '^sed\s+-n\s+[''"]?[0-9]+(?:,[0-9$]+)?p[''"]?\s+\S+$'
  confirm:
    - '^git\s+push(?:\s|$)'
    - '^docker(?:\s|$)'
    - '^npm\s+install(?:\s|$)'
    - '^apt(?:-get)?\s+install(?:\s|$)'
