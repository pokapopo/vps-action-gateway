commands:
  default: confirm
  allow:
    - '^git\s+(?:status|diff|rev-parse|log)(?:\s|$)'
    - '^nginx\s+-t(?:\s|$)'
    - '^systemctl\s+(?:status|is-active|show)(?:\s|$)'
    - '^(?:pwd|whoami|uptime)$'
    - '^id(?:\s+[-A-Za-z0-9]+)*$'
    - '^uname(?:\s+[-A-Za-z0-9]+)*$'
    - '^free(?:\s+[-A-Za-z0-9]+)*$'
    - '^ls(?:\s+-[A-Za-z0-9]+)*(?:\s+(?:/root/cyberboss|/opt/vps-action-gateway|/tmp/vps-action-feasibility)(?:/[A-Za-z0-9._-]+)*)*$'
    - '^node\s+--check\s+(?:/root/cyberboss|/opt/vps-action-gateway)(?:/[A-Za-z0-9._-]+)+$'
    - '^grep(?:\s+-[A-Za-z0-9-]+)*\s+\S+\s+(?:/root/cyberboss|/opt/vps-action-gateway|/tmp/vps-action-feasibility)(?:/[A-Za-z0-9._-]+)*(?:\s+(?:/root/cyberboss|/opt/vps-action-gateway|/tmp/vps-action-feasibility)(?:/[A-Za-z0-9._-]+)*)*$'
    - '^sed\s+-n\s+[''\"]?[0-9]+(?:,[0-9$]+)?p[''\"]?\s+(?:/root/cyberboss|/opt/vps-action-gateway|/tmp/vps-action-feasibility)(?:/[A-Za-z0-9._-]+)*$'
    - '^sha256sum\s+(?:/root/cyberboss|/opt/vps-action-gateway|/tmp/vps-action-feasibility)(?:/[A-Za-z0-9._-]+)*(?:\s+(?:/root/cyberboss|/opt/vps-action-gateway|/tmp/vps-action-feasibility)(?:/[A-Za-z0-9._-]+)*)*$'
    - '^sqlite3\s+-readonly\s+\S+\s+[''"]?(?:SELECT|PRAGMA|EXPLAIN\s+QUERY\s+PLAN\s+SELECT)\b[^;]*;?[''"]?$'
    - '^grep(?:\s+--?[A-Za-z0-9][A-Za-z0-9=-]*)*\s+\S+\s+\S+(?:\s+\S+)*$'
    - '^(?:head|tail)(?:\s+--?[A-Za-z0-9][A-Za-z0-9=-]*)*(?:\s+\S+)?$'
    - '^(?:sort|uniq|wc)(?:\s+--?[A-Za-z0-9][A-Za-z0-9=-]*)*$'
    - '^ss(?:\s+[-A-Za-z0-9=:.,/]+)*$'
    - '^sha256sum\s+\S+(?:\s+\S+)*$'
    - '^sed\s+-n\s+[''"]?[0-9]+(?:,[0-9$]+)?p[''"]?\s+\S+$'
  confirm:
    - '^git\s+push(?:\s|$)'
    - '^docker(?:\s|$)'
    - '^npm\s+install(?:\s|$)'
    - '^apt(?:-get)?\s+install(?:\s|$)'
  deny:
    - '^rm\s+-[^\n]*r[^\n]*f[^\n]*\s+/(?:\s|$)'
    - '^mkfs(?:\.|\s|$)'
    - '^(?:shutdown|reboot|poweroff|halt)(?:\s|$)'
